# Frontend routes are NOT served on the API host. The public frontend lives on
# rent.vijaykrsha.online (Cloudflare Pages). Everything under /rent that is not
# an API path is redirected there, preserving the full path and query string.
# The ^~ backend locations in api.conf and tenant-api.conf are evaluated first,
# so only true frontend page paths reach these redirects.

location = /rent {
    return 301 https://rent.vijaykrsha.online/rent/;
}

location /rent/ {
    return 301 https://rent.vijaykrsha.online$request_uri;
}

# Root-level tenant portal deep links (legacy share links without the /rent
# prefix) forward to the same page on the public frontend, re-adding the /rent
# base path that the Pages site expects.
location ~ ^/[^/]+/t/[0-9]+/[^/]+(/.*)?$ {
    return 301 https://rent.vijaykrsha.online/rent$request_uri;
}
