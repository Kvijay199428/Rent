# API routes → the release backend slot (propaura_backend_prod).
# The backend address is set in /etc/nginx/upstream/active.conf. This file is
# included BEFORE frontend.conf by the routes/*.conf glob, so these regex/prefix
# locations match tenant API deep links before the frontend SPA fallbacks.

# Backend liveness (JSON health, reflects the real backend state)
location = /health {
    access_log off;
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

# Bare roots of every trailing-slash prefix → strict 404, no redirect.
# Without these exact matches, nginx core auto-redirects "/admin" → "/admin/"
# (301) for any prefix location ending in "/" served by proxy_pass, which
# leaks a redirect on non-API paths. Exact matches take priority over prefixes.
location = /platform { return 404; }
location = /admin { return 404; }
location = /landlord { return 404; }
location = /auth { return 404; }
location = /api { return 404; }
location = /ws { return 404; }
location = /static { return 404; }

# Tenant portal API: /{landlordUuid}/t/{propertyId}/{tenantId}/{viewToken}/api/...
location ~ ^/[^/]+/t/[0-9]+/[0-9]+/[^/]+/api/ {
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Platform admin API
location ^~ /platform/ {
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Admin app API (pages are served from /admin/ by the frontend)
location ^~ /admin/ {
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Landlord app API (pages are served from /landlord/ by the frontend)
location ^~ /landlord/ {
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Generic auth/API prefixes
location ^~ /auth/ {
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

location ^~ /api/ {
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

# WebSockets (admin/landlord live sync)
location ^~ /ws/ {
    proxy_pass http://$release_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# Static uploads (receipts, signatures, KYC) — always served by the backend
location ^~ /static/ {
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
