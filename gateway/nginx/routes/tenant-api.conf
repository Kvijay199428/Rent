# /rent/-prefixed API routes → active release backend slot.
# Frontend apps build API URLs as <API_ORIGIN>/rent/... (see shared/routes.json
# basePath "/rent"), while the backend registers the same endpoints at the root
# level (/admin/api/..., /landlord/api/..., /landlord/{uuid}/api/...,
# /tenant/api/..., /{landlordUuid}/t/{tenantId}/{viewToken}/api/...). These
# locations strip the /rent prefix before proxying and pass X-Forwarded-Prefix
# so auth cookie paths are set under /rent (see forwarded_prefix_middleware in
# backend main.py).
#
# Only genuine API paths are matched here — frontend *page* paths under the same
# prefixes (/rent/admin/login, /rent/landlord/{uuid}, /rent/tenant/login) are
# left to redirect.conf to forward to the public frontend on rent.vijaykrsha.online.

# Tenant deep-link API: /rent/{landlordUuid}/t/{propertyId}/{tenantId}/{viewToken}/api/...
location ~ ^/rent/[^/]+/t/[0-9]+/[0-9]+/[^/]+/api/ {
    rewrite ^/rent(/.*)$ $1 break;
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /rent;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Tenant portal auth API: /rent/tenant/api/...
location ~ ^/rent/tenant/api/ {
    rewrite ^/rent(/.*)$ $1 break;
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /rent;
