# Landlord app API: /rent/landlord/api/... and /rent/landlord/{uuid}/api/...
location ~ ^/rent/landlord/(api|[^/]+/api)/ {
    rewrite ^/rent(/.*)$ $1 break;
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /rent;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Platform admin API: /rent/platform/...
location ^~ /rent/platform/ {
    rewrite ^/rent(/.*)$ $1 break;
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /rent;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# WebSockets (admin/landlord live sync): /rent/ws/...
location ^~ /rent/ws/ {
    rewrite ^/rent(/.*)$ $1 break;
    proxy_pass http://$release_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /rent;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# Generic auth/API prefixes
location ^~ /rent/api/ {
    rewrite ^/rent(/.*)$ $1 break;
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /rent;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

location ^~ /rent/auth/ {
    rewrite ^/rent(/.*)$ $1 break;
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /rent;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

# Static uploads (receipts, signatures, KYC): /rent/static/...
# Note: no X-Forwarded-Prefix here — starlette Mount would set
# root_path=/rent/static/uploads on a path already stripped of /rent,
# breaking StaticFiles lookup (UPLOADS_DIR/static/uploads/... -> 404).
location ^~ /rent/static/ {
    rewrite ^/rent(/.*)$ $1 break;
    proxy_pass http://$release_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
