worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Docker embedded DNS — required for the variable-based proxy_pass used by
    # the release backend upstream (/etc/nginx/upstream/active.conf).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API edge — api.vijaykrsha.online. API-only: release backend routes
    # (root-level + /-prefixed) are proxied; all frontend page paths are a
    # strict 404 with no redirect (the public frontend lives on Cloudflare
    # Pages at rent.vijaykrsha.online). No HTML is ever served on this host.
    server {
        listen 28014;
        server_name api.vijaykrsha.online;

        # Active release backend slot — set in /etc/nginx/upstream/active.conf
        include /etc/nginx/upstream/active.conf;

        include /etc/nginx/routes/api.conf;

        # No redirects on the API host: bare domain and every other page path
        # return 404. The frontend is reached only at its own URI
        # (rent.vijaykrsha.online).
        location / {
            return 404;
        }
    }

    # Frontend hostname edge — app.vijaykrsha.online. The backend never serves
    # frontend HTML and this gateway no longer mounts frontend/build-output, so
    # nothing lives at this host: every path returns a strict 404. The app is
    # served by Cloudflare Pages at rent.vijaykrsha.online only.
    server {
        listen 28014;
        server_name app.vijaykrsha.online;

        location / {
            return 404;
        }
    }
}
