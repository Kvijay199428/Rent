services:
  frontend-test:
    image: nginx:alpine
    container_name: rent-frontend-test
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "28080:80"
    networks:
      - vega-gateway

  rent-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rent-backend-test
    restart: unless-stopped
    expose:
      - "28001"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend/storage:/code/storage
    networks:
      - vega-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:28001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  vega-gateway:
    external: true
