events {
    worker_connections 2048;
}

http {
    client_max_body_size 100M;

    server {
        listen 80;
        server_name _;

        # Tenant app: dynamic URL pattern served by backend
        location ~ ^/rent/[^/]+/t/[^/]+/[^/]+ {
            proxy_pass http://rent-backend:28001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Landlord API (UUID-prefixed paths)
        location ~ ^/rent/[^/]+/api/ {
            proxy_pass http://rent-backend:28001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Tenant API (UUID-prefixed paths under tenant token)
        location ~ ^/rent/[^/]+/t/[^/]+/[^/]+/api/ {
            proxy_pass http://rent-backend:28001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin API
        location /rent/admin/api/ {
            proxy_pass http://rent-backend:28001/admin/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check passthrough
        location /health {
            proxy_pass http://rent-backend:28001/health;
        }

        # SPA fallback: landlord
        location /rent/landlord {
            try_files $uri $uri/ /rent/landlord/index.html;
        }

        # SPA fallback: admin
        location /rent/admin {
            try_files $uri $uri/ /rent/admin/index.html;
        }

        # SPA fallback: tenant (asset path)
        location /rent/t {
            try_files $uri $uri/ /rent/tenant/index.html;
        }

        # Landing page root
        location = /rent {
            try_files /rent/index.html =404;
        }

        # Serve static frontend files
        location /rent/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }
    }
}
