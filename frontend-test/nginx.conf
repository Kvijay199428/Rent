events {
    worker_connections 2048;
}

http {
    client_max_body_size 100M;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # Health check passthrough
        location /health {
            proxy_pass http://rent-backend:28001/health;
        }

        # WebSocket: /rent/ws/* → /ws/*
        location ~ ^/rent/ws/ {
            rewrite ^/rent/(.*)$ /$1 break;
            proxy_pass http://rent-backend:28001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Platform admin API: /rent/platform-admin/api/* → /platform-admin/api/*
        location ~ ^/rent/platform-admin/api/ {
            rewrite ^/rent/(.*)$ /$1 break;
            proxy_pass http://rent-backend:28001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Landlord API (with or without UUID): /rent/landlord/[{uuid}/]api/* → /landlord/[{uuid}/]api/*
        location ~ ^/rent/landlord/(api/|[^/]+/api/) {
            rewrite ^/rent/(.*)$ /$1 break;
            proxy_pass http://rent-backend:28001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tenant API: /rent/{uuid}/t/{property}/{id}/{token}/api/* → /{uuid}/t/{property}/{id}/{token}/api/*
        location ~ ^/rent/[^/]+/t/[^/]+/[^/]+/[^/]+/api/ {
            rewrite ^/rent/(.*)$ /$1 break;
            proxy_pass http://rent-backend:28001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback: landlord
        location /rent/landlord {
            try_files $uri $uri/ /rent/landlord/index.html;
        }

        # SPA fallback: admin
        location /rent/admin {
            try_files $uri $uri/ /rent/admin/index.html;
        }

        # SPA fallback: tenant (asset path)
        location /rent/t {
            try_files $uri $uri/ /rent/tenant/index.html;
        }

        # Landing page root
        location = /rent {
            try_files /rent/index.html =404;
        }

        # Static files and default
        location /rent/ {
            try_files $uri $uri/ =404;
        }
    }
}
