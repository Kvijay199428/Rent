<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">
  <title>PropAura — Maintenance</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#0d0f17; color:#e8eaf0; font-family:Inter,system-ui,sans-serif; text-align:center; }
    .card { max-width:420px; padding:40px 24px; }
    .icon { font-size:48px; margin-bottom:16px; }
    h1 { font-size:1.4rem; margin:0 0 12px; }
    p { color:#7a7f99; font-size:0.95rem; line-height:1.6; }
    .note { margin-top:24px; font-size:0.75rem; color:#565b70; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>PropAura is under maintenance</h1>
    <p>We'll resume shortly. Your data is safe. This page refreshes automatically every 30 seconds.</p>
    <div class="note">PROP<span style="color:#95A58F">AURA</span></div>
  </div>
</body>
</html>
