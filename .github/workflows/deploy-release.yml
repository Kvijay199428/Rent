name: Deploy Backend

on:
  push:
    branches: [main, release]
    paths:
      - 'backend/**'
      - 'compose.prod.yml'
      - 'compose.dev.yml'
      - 'deploy/**'
      - 'gateway/nginx/**'
      - '.env.release.example'
      - '.env.development.example'
      - '.github/workflows/deploy-release.yml'
      - 'deploy.py'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via deploy.py (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install paramiko
        run: pip install paramiko

      - name: Deploy backend (main=dev, release=prod)
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ "${{ github.ref_name }}" = "release" ]; then
            DEPLOY_ARGS="--release"
          else
            DEPLOY_ARGS="--main"
          fi
          echo "Deploying branch ${{ github.ref_name }} with $DEPLOY_ARGS"
          python3 deploy.py $DEPLOY_ARGS

      - name: Health check
        run: |
          sleep 5
          curl -fsS https://api.vijaykrsha.online/health
