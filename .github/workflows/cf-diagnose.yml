name: CF Diagnose (temp)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Cloudflare access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          AUTH="Authorization: Bearer $CF_TOKEN"
          echo "=== token verify ==="
          curl -s -H "$AUTH" -w 'HTTP=%{http_code}\n' >&2 https://api.cloudflare.com/client/v4/user/tokens/verify
          echo
          echo "=== accounts accessible ==="
          curl -s -H "$AUTH" -w 'HTTP=%{http_code}\n' >&2 "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -c '.result[]? | {id, name}'
          echo "=== zone lookup: vijaykrsha.online ==="
          curl -s -H "$AUTH" -w 'HTTP=%{http_code}\n' >&2 "https://api.cloudflare.com/client/v4/zones?name=vijaykrsha.online" | jq -c '{success, errors: .errors[0:2], result: [.result[]? | {id, name, status}]}'
          echo "=== dns records for zone (matching rent|api|www) ==="
          curl -s -H "$AUTH" -w 'HTTP=%{http_code}\n' >&2 "https://api.cloudflare.com/client/v4/zones/cc72e2654661e9c93f16e5fd0d1419fc/dns_records?per_page=100" | jq -c '[.result[]? | select(.name | test("rent|api|www")) | {id, type, name, content, proxied, ttl}]'
          echo "=== pages projects in secret account ==="
          curl -s -H "$AUTH" -w 'HTTP=%{http_code}\n' >&2 "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -c '{success, errors: .errors[0:2], result: [.result[]? | {name, subdomain, production_branch}]}'
          echo "=== domains per project ==="
          for p in $(curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -r '.result[]?.name'); do
            echo "-- project: $p --"
            curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$p/domains" | jq -c '{success, errors: .errors[0:2], result: [.result[]? | {name, status, zone_id}]}'
          done
          echo "=== try: re-add custom domain on project rent (idempotent) ==="
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -w 'HTTP=%{http_code}\n' >&2 -d '{"name":"rent.vijaykrsha.online"}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/rent/domains" | jq -c '{success, errors: .errors[0:3], result: (.result | if type == "object" then {name, status, zone_id} else . end)}'
          echo "=== re-check domains on project rent ==="
          curl -s -H "$AUTH" -w 'HTTP=%{http_code}\n' >&2 "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/rent/domains" | jq -c '{success, errors: .errors[0:2], result: [.result[]? | {name, status, zone_id}]}'
