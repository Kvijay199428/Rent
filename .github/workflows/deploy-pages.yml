name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/landing-app/package-lock.json
            frontend/admin-app/package-lock.json
            frontend/landlord-app/package-lock.json
            frontend/tenant-app/package-lock.json

      - name: Install & Build All Apps
        run: |
          cd frontend
          bash build.sh
        env:
          VITE_API_BASE_URL: https://endomorphic-semiprotectively-jamaal.ngrok-free.dev

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: frontend/build-output
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build-output

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build-output
          wranglerVersion: "3.90.0"
          command: pages deploy . --project-name=rent --branch=dev
