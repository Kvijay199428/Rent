# Development Nginx gateway — mirrors the migrated gateway/nginx routing so
# the dev stack behaves like production when reached through the ngrok tunnel.
#
# The frontend apps build API URLs and page URLs at the root level (no base
# path) and backend_dev registers the same endpoints at the root level, so
# these locations pass through unchanged with no prefix to strip.
#
# Tenant portal pages and assets (/t, /t/, /tenant/... and both deep-link
# forms) are served by the tenant-app Vite dev server (frontend_dev, base /t/)
# so devs get HMR. Everything else — admin/landlord/landing apps, API,
# uploads — stays on the dev-only frontend router (app/pages/frontend.py) in
# backend_dev.
#
# Ports follow deploy/ports.py: gateway 28005, backend 28002, frontend Vite 28001.
# Production gateway/containers/DNS are untouched by this file.

events {
    worker_connections 2048;
}

http {
    client_max_body_size 100M;

    # Docker embedded DNS — lets nginx re-resolve backend_dev/frontend_dev when
    # a deploy recreates those containers (their IPs change on recreate), so the
    # gateway self-heals without a container restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 28005;
        server_name _;

        # Upstreams resolved via the resolver per request, not once at start.
        set $backend_dev propaura_backend_dev:28002;
        set $frontend_dev propaura_frontend_dev:28001;

        # Backend liveness — no prefix, direct pass-through.
        location = /health {
            proxy_pass http://$backend_dev/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Tenant deep-link API: /{landlordUuid}/t/{propertyId}/{tenantId}/{viewToken}/api/...
        location ~ ^/[^/]+/t/[0-9]+/[0-9]+/[^/]+/api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Tenant portal auth API: /tenant/api/...
        location ~ ^/tenant/api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Admin app API: /admin/api/...
        location ~ ^/admin/api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Landlord app API: /landlord/api/... and /landlord/{uuid}/api/...
        location ~ ^/landlord/(api|[^/]+/api)/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Platform admin API: /platform/...
        location ^~ /platform/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSockets (admin/landlord live sync): /ws/...
        location ^~ /ws/ {
            proxy_pass http://$backend_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Generic auth/API prefixes
        location ^~ /api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location ^~ /auth/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Static uploads (receipts, signatures, KYC): /static/...
        location ^~ /static/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Root-level tenant portal API: /{landlordUuid}/t/{propertyId}/{tenantId}/{viewToken}/api/...
        # Mirrors gateway/nginx/routes/api.conf so the page deep-link location
        # below never swallows API calls. Passed through unchanged (backend
        # registers these at the root level).
        location ~ ^/[^/]+/t/[0-9]+/[0-9]+/[^/]+/api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── Tenant portal pages & assets → tenant-app Vite dev server ──────────

        # Tenant portal entry: /t → /t/ (mirrors frontend.conf)
        location = /t {
            return 301 /t/;
        }

        # Tenant SPA root + hashed assets: /t/... → Vite dev server (base /t/)
        location ^~ /t/ {
            proxy_pass http://$frontend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Tenant auth/login app pages: /tenant/... → tenant SPA entry.
        # Must appear after the ^/tenant/api/ location above.
        location ~ ^/tenant(/.*)?$ {
            rewrite ^ /t/ break;
            proxy_pass http://$frontend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Everything else (pages, SPA assets, deep links) — pass through unchanged
        # so the dev frontend router on backend_dev serves them.
        location / {
            proxy_pass http://$backend_dev;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
