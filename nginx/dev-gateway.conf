# Development Nginx gateway — mirrors the migrated gateway/nginx routing so
# the dev stack behaves like production when reached through the ngrok tunnel.
#
# The frontend apps build API URLs and page URLs at the root level (no base
# path) and backend_dev registers the same endpoints at the root level, so
# these locations pass through unchanged with no prefix to strip.
#
# The backend is API-only (SERVE_FRONTEND=false) — it registers no page
# routers, so it never serves HTML. The dev frontend is hosted on the
# Cloudflare Pages `dev` branch; the tenant-app Vite dev server is retired.
# All non-API page paths (/t/, /tenant/..., /landlord/..., /admin/, /) get a
# strict 404 from this gateway — no redirect, no backend round-trip.
#
# Ports follow deploy/ports.py: gateway 28005, backend 28002.
# Production gateway/containers/DNS are untouched by this file.

events {
    worker_connections 2048;
}

http {
    client_max_body_size 100M;

    # Docker embedded DNS — lets nginx re-resolve backend_dev when
    # a deploy recreates that container (its IP changes on recreate), so the
    # gateway self-heals without a container restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 28005;
        server_name _;

        # Upstreams resolved via the resolver per request, not once at start.
        set $backend_dev propaura_backend_dev:28002;

        # Backend liveness — no prefix, direct pass-through.
        location = /health {
            proxy_pass http://$backend_dev/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Tenant deep-link API: /{landlordUuid}/t/{propertyId}/{tenantId}/{viewToken}/api/...
        location ~ ^/[^/]+/t/[0-9]+/[0-9]+/[^/]+/api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Tenant portal auth API: /tenant/api/...
        location ~ ^/tenant/api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Admin app API: /admin/api/...
        location ~ ^/admin/api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Landlord app API: /landlord/api/... and /landlord/{uuid}/api/...
        location ~ ^/landlord/(api|[^/]+/api)/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Platform admin API: /platform/...
        location ^~ /platform/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSockets (admin/landlord live sync): /ws/...
        location ^~ /ws/ {
            proxy_pass http://$backend_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Generic auth/API prefixes
        location ^~ /api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location ^~ /auth/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Static uploads (receipts, signatures, KYC): /static/...
        location ^~ /static/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Root-level tenant portal API: /{landlordUuid}/t/{propertyId}/{tenantId}/{viewToken}/api/...
        # Mirrors gateway/nginx/routes/api.conf so API calls are never caught
        # by the 404 catch-all below. Passed through unchanged (backend
        # registers these at the root level).
        location ~ ^/[^/]+/t/[0-9]+/[0-9]+/[^/]+/api/ {
            proxy_pass http://$backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Everything else — page paths (/t/, /tenant/..., /landlord/...,
        # /admin/, /) and unknown routes — is NOT served here. The backend is
        # API-only, so a strict 404 (no redirect) keeps HTML off the ngrok
        # host; the correct frontend is on the Cloudflare Pages `dev` branch.
        location / {
            return 404;
        }
    }
}
