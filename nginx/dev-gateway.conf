# Development Nginx gateway — mirrors gateway/nginx/routes/tenant-api.conf so the
# dev stack behaves like production when reached through the ngrok tunnel.
#
# The frontend apps build API URLs as <origin>/rent/... while backend_dev
# registers the same endpoints at the root level. These locations strip the
# /rent prefix before proxying and pass X-Forwarded-Prefix /rent so auth cookie
# paths are set under /rent (see forwarded_prefix_middleware in backend main.py).
#
# Only genuine API/asset paths are stripped. Frontend page paths under /rent/
# (/rent/admin/login, /rent/landlord/{uuid}, /rent/t/...) are passed through
# unchanged so the dev-only frontend router (app/pages/frontend.py) serves them.
#
# Production gateway/containers/DNS are untouched by this file.

events {
    worker_connections 2048;
}

http {
    client_max_body_size 100M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_dev_upstream {
        server backend_dev:28001;
    }

    server {
        listen 80;
        server_name _;

        # Backend liveness — no prefix, direct pass-through.
        location = /health {
            proxy_pass http://backend_dev_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Tenant deep-link API: /rent/{landlordUuid}/t/{propertyId}/{tenantId}/{viewToken}/api/...
        location ~ ^/rent/[^/]+/t/[0-9]+/[0-9]+/[^/]+/api/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /rent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Tenant portal auth API: /rent/tenant/api/...
        location ~ ^/rent/tenant/api/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /rent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Admin app API: /rent/admin/api/...
        location ~ ^/rent/admin/api/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /rent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Landlord app API: /rent/landlord/api/... and /rent/landlord/{uuid}/api/...
        location ~ ^/rent/landlord/(api|[^/]+/api)/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /rent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Platform admin API: /rent/platform/...
        location ^~ /rent/platform/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /rent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSockets (admin/landlord live sync): /rent/ws/...
        location ^~ /rent/ws/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /rent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Generic auth/API prefixes
        location ^~ /rent/api/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /rent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location ^~ /rent/auth/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /rent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Static uploads (receipts, signatures, KYC): /rent/static/...
        # Note: no X-Forwarded-Prefix here — starlette Mount would set
        # root_path=/rent/static/uploads on a path already stripped of /rent,
        # breaking StaticFiles lookup (UPLOADS_DIR/static/uploads/... -> 404).
        location ^~ /rent/static/ {
            rewrite ^/rent(/.*)$ $1 break;
            proxy_pass http://backend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Everything else (pages, SPA assets, deep links) — pass through unchanged
        # so the dev frontend router on backend_dev serves them.
        location / {
            proxy_pass http://backend_dev_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
